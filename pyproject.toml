[project]
name = "fedex-air-network"
version = "0.1.0"
description = "FedEx Express air cargo network analytics on BTS T-100 segment data"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "altair>=6.3.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "streamlit>=1.67.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
